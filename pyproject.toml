[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-qhull"
version = "0.1.0"
description = "Qhull geometry algorithms ported to Mojo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]
license = "MIT"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
